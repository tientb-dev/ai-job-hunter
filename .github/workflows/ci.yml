name: Foundation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR runs are cancelled; every push to main is still tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '12.14.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Parser worker deadlines include startup and cleanup; avoid competing
      # with the frontend worker pool on the two-core hosted runner.
      - run: pnpm -r --workspace-concurrency=1 run test
      - run: pnpm build
      - name: Configure disposable test database
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { randomBytes } from 'node:crypto';
          import { writeFileSync } from 'node:fs';
          const password = randomBytes(24).toString('hex');
          console.log(`::add-mask::${password}`);
          writeFileSync('.env.test', [
            'NODE_ENV=test', 'DB_ENV=test', 'DB_HOST=127.0.0.1',
            'DB_PORT=5433', 'DB_NAME=ai_job_hunter_test',
            'DB_USER=ai_job_hunter_test', `DB_PASSWORD=${password}`, '',
          ].join('\n'), { mode: 0o600 });
          NODE
      - run: pnpm db:test:up
      - run: pnpm db:test:migrate:compiled
      - run: pnpm test:integration
      - name: Stop disposable test database
        if: always()
        shell: bash
        run: |
          if [ -f .env.test ]; then
            pnpm db:test:down
          fi

  # Windows-only path handling (PDF resource separators); parser suites only.
  windows-pdf-parser:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '12.14.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: PDF parser and resource tests
        working-directory: apps/api
        run: |
          pnpm test:compile
          node --experimental-vm-modules node_modules/jest/bin/jest.js --config jest.config.js --runInBand pdf-parser pdf-resources
